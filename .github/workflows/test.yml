name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  harbor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - name: Check formatting
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Test
        run: forge test -vv
      - name: Verify internal pool on fresh Anvil
        run: python3 scripts/check-local.py
